server:
  port: 8083

spring:
  application:
    name: substrate-agent
  threads:
    virtual:
      enabled: true # LLM 长耗时调用不占用平台线程
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: tlc-agent-decision-producer

tlc:
  agent:
    scan-interval-ms: 15000       # 情绪扫描周期
    min-samples: 5                # 触发分析的最少弹幕数
    budget-max-total-fen: 10000   # 单次红包雨预算上限（分），LLM 输出会被裁剪
    budget-max-count: 200         # 单次红包雨数量上限
    cold-threshold: 35            # 热度分低于该值视为冷场
    audit-base-url: ${AUDIT_BASE_URL:http://localhost:8086}
